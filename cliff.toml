# git-cliff configuration for PhotoProof.
# Generates CHANGELOG.md from Conventional Commits in the git history.
# Re-run via scripts/release.sh; do not edit CHANGELOG.md by hand.

[changelog]
header = """# Changelog

All notable changes to PhotoProof are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/),
and this project follows [Semantic Versioning](https://semver.org/) and
[Conventional Commits](https://www.conventionalcommits.org/).

"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\\n") | first | upper_first }}{% if commit.scope %} *({{ commit.scope }})*{% endif %}
{% endfor %}
{% endfor %}
"""

trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"

# First match wins. Conventional prefixes route to friendly groups; the
# trailing catch-all keeps non-conventional commits from disappearing.
commit_parsers = [
    { message = "^feat",              group = "Features" },
    { message = "^fix",               group = "Bug Fixes" },
    { message = "^perf",              group = "Performance" },
    { message = "^refactor",          group = "Refactor" },
    { message = "^docs",              group = "Documentation" },
    { message = "^build",             group = "Build" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore",             group = "Chores" },
    { message = "^style",             skip = true },
    { message = "^test",              skip = true },
    { message = "^ci",                skip = true },
    { message = ".*",                 group = "Other" },
]
